name: DBP-V2.0 CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - User-Service
          - Customer-Service
          - BackOffice-Service

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests and verification
        run: ./mvnw --batch-mode --no-transfer-progress verify

  docker:
    name: Build image ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service:
          - User-Service
          - Customer-Service
          - BackOffice-Service

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag dbp-v2-0-${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        env:
          POSTGRES_CUSTOMER_DB: customer-db
          POSTGRES_CUSTOMER_USER: DB_Admin
          POSTGRES_CUSTOMER_PASSWORD: ci-customer-password
          POSTGRES_USER_DB: user-db
          POSTGRES_USER_USER: DB_Admin
          POSTGRES_USER_PASSWORD: ci-user-password
          POSTGRES_BACKOFFICE_DB: backoffice-db
          POSTGRES_BACKOFFICE_USER: DB_Admin
          POSTGRES_BACKOFFICE_PASSWORD: ci-backoffice-password
          POSTGRES_ROOT_PASSWORD: ci-root-password
          KEYCLOAK_ADMIN_USERNAME: admin
          KEYCLOAK_ADMIN_PASSWORD: ci-keycloak-password
          CUSTOMER_SERVICE_URL: http://customer-service:8082
        run: docker compose -f compose.yml config --quiet
