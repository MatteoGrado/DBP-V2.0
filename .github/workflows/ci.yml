name: DBP-V2.0 CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - Development
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        service:
          - User-Service
          - Customer-Service
          - BackOffice-Service

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: ${{ env.ACT != 'true' && 'maven' || '' }}
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Verify Java installation
        run: java -version

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Maven verification
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            verify

      - name: Publish Surefire reports
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Build image ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test

    strategy:
      fail-fast: false
      matrix:
        service:
          - User-Service
          - Customer-Service
          - BackOffice-Service

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        shell: bash
        env:
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          IMAGE_NAME=$(echo "$SERVICE_NAME" | tr '[:upper:]' '[:lower:]')

          docker build \
            --tag "dbp-v2-0-${IMAGE_NAME}:${GITHUB_SHA}" \
            "./${SERVICE_NAME}"

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        shell: bash
        run: |
          cat > .env <<'EOF'
          POSTGRES_CUSTOMER_DB=customer-db
          POSTGRES_CUSTOMER_USER=DB_Admin
          POSTGRES_CUSTOMER_PASSWORD=ci-customer-password
          POSTGRES_USER_DB=user-db
          POSTGRES_USER_USER=DB_Admin
          POSTGRES_USER_PASSWORD=ci-user-password
          POSTGRES_BACKOFFICE_DB=backoffice-db
          POSTGRES_BACKOFFICE_USER=DB_Admin
          POSTGRES_BACKOFFICE_PASSWORD=ci-backoffice-password
          POSTGRES_ROOT_PASSWORD=ci-root-password
          KEYCLOAK_ADMIN_USERNAME=admin
          KEYCLOAK_ADMIN_PASSWORD=ci-keycloak-password
          CUSTOMER_SERVICE_URL=http://customer-service:8082
          CLIENT_SECRET=ci-client-secret
          KEYCLOAK_CLIENT_SECRET=ci-client-secret
          EOF

      - name: Verify environment file
        run: test -f .env

      - name: Verify Docker Compose
        run: docker compose version

      - name: Validate Compose configuration
        run: docker compose -f compose.yml config --quiet
