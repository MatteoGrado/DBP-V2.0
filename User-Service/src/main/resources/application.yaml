spring:
  application:
    name: User-Service

  datasource:
    url: jdbc:postgresql://${DB_HOST:user-db}:5432/${POSTGRES_USER_DB:user-db}
    username: ${POSTGRES_USER_USER:DB_Admin}
    password: ${POSTGRES_USER_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/DBP-V2.0

  cloud:
    consul:
      host: ${CONSUL_HOST:consul}
      port: ${CONSUL_PORT:8500}
      discovery:
        service-name: ${spring.application.name}
        prefer-ip-address: true

server:
  port: ${SERVER_PORT:8081}

keycloak:
  server-url: http://keycloak:8080
  realm: DBP-V2.0
  client-id: user-service
  client-secret: ${CLIENT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: TRACE