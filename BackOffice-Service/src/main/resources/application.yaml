spring:
  application:
    name: backoffice-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:backoffice-db}:${DB_PORT:5432}/${POSTGRES_BACKOFFICE_DB:backoffice-db}
    username: ${POSTGRES_BACKOFFICE_USER}
    password: ${POSTGRES_BACKOFFICE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/DBP-V2.0}

  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        service-name: ${spring.application.name}
        prefer-ip-address: true

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://keycloak:8080}
  realm: ${KEYCLOAK_REALM:DBP-V2.0}
  client-id: ${KEYCLOAK_CLIENT_ID:backoffice-service}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
