services:

  customer-service:
    build: ./Customer-Service
    depends_on:
      consul:
        condition: service_healthy
      customer-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: customer-db
      DB_PORT: 5432
      POSTGRES_CUSTOMER_DB: ${POSTGRES_CUSTOMER_DB}
      POSTGRES_CUSTOMER_USER: ${POSTGRES_CUSTOMER_USER}
      POSTGRES_CUSTOMER_PASSWORD: ${POSTGRES_CUSTOMER_PASSWORD}
    ports:
      - "8082:8082"

  customer-db:
    image: postgres:18
    container_name: customer-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_CUSTOMER_DB}
      POSTGRES_USER: ${POSTGRES_CUSTOMER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CUSTOMER_PASSWORD}
    ports:
      - "3307:5432"
    volumes:
      - customer-db-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_CUSTOMER_USER} -d ${POSTGRES_CUSTOMER_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  user-service:
    build: ./User-Service
    depends_on:
      consul:
        condition: service_healthy
      user-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: user-db
      DB_PORT: 5432
      POSTGRES_USER_DB: ${POSTGRES_USER_DB}
      POSTGRES_USER_USER: ${POSTGRES_USER_USER}
      POSTGRES_USER_PASSWORD: ${POSTGRES_USER_PASSWORD}
    ports:
      - "8081:8081"

  user-db:
    image: postgres:18
    container_name: user-db
    env_file:
      .env
    environment:
      POSTGRES_DB: ${POSTGRES_USER_DB}
      POSTGRES_USER: ${POSTGRES_USER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_USER_PASSWORD}
      POSTGRES_ROOT_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
    ports:
      - "3306:5432"
    volumes:
      - user-db-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER_USER} -d ${POSTGRES_USER_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  consul:
    image: hashicorp/consul:1.20
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"
    healthcheck:
      test: [ "CMD", "consul", "info" ]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    container_name: keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data


  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:-1}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES:-broker,controller}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS:-1@kafka:29093}
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES:-CONTROLLER}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS:-PLAINTEXT://:9092,CONTROLLER://:29093}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS:-PLAINTEXT://localhost:9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:-CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME:-PLAINTEXT}
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}
    healthcheck:
      test:
        [
          "CMD",
          "/opt/kafka/bin/kafka-broker-api-versions.sh",
          "--bootstrap-server",
          "localhost:9092"
        ]
      interval: 10s
      timeout: 10s
      retries: 20


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.4
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 20


  redis:
    image: redis:8
    container_name: redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 20

  ocrmypdf:
    image: jbarlow83/ocrmypdf:latest
    container_name: ocrmypdf
    entrypoint: [ "python", "/app/webservice.py" ]
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./ocr-data:/data
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    platform: linux/amd64
    ports:
      - "1025:1025"
      - "8025:8025"


volumes:
  customer-db-data:
  user-db-data:
  kafka_data:
  elasticsearch-data:
  redis-data:
  keycloak-data:
